<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lajão · Cartão digital</title>
<meta name="description" content="Lajão – pequenas obras, construção, reforma, escavação, demolição, terraplanagem e perfuração. Contato: (47) 9 9264-0102.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* VOICE: direto, robusto, de obra
   IDEA: o cartão de visita físico da Lajão, em versão de bolso
   PICTURE: logo sobre grafite com as colunas do verso em contorno
   COLOUR and TYPE: grafite #282A2B, laranja #F36721, off-white; Saira + Manrope
   LAYOUT: coluna única de celular, botões grandes de contato */
:root{--bg:#F0F0EF;--ink:#282A2B;--muted:#55575A;--card:#fff;--line:#DCDCD9;--or:#F36721}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:#1F2122;color:var(--ink);font:16px/1.5 Manrope,system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center}
.wrap{width:100%;max-width:440px;background:var(--bg);min-height:100vh;display:flex;flex-direction:column}
header{position:relative;background:#282A2B;padding:56px 24px 96px;display:flex;flex-direction:column;align-items:center;gap:18px;overflow:hidden}
header .deco{position:absolute;left:-40px;top:10px;width:420px;height:300px}
.logo{position:relative;width:210px;height:auto}
.tag{position:relative;margin:0;font:500 13px Saira,sans-serif;letter-spacing:3px;text-transform:uppercase;color:#C9C9C6}
.who{margin:-60px 20px 0;position:relative;background:var(--card);border-radius:22px;padding:22px;display:flex;align-items:center;gap:16px;box-shadow:0 10px 30px rgba(40,42,43,.14)}
.badge{width:64px;height:64px;flex:none;border-radius:16px;background:#282A2B;display:grid;place-items:center}
.badge .ic{width:38px;height:auto}
h1{margin:0;font:700 24px/1.1 Saira,sans-serif}
.who p{margin:4px 0 0;font-size:14px;color:var(--muted)}
nav{padding:22px 20px 0;display:flex;flex-direction:column;gap:12px}
nav a{min-height:58px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 20px;font-weight:600;font-size:15px;color:inherit;text-decoration:none;transition:transform .15s,border-color .15s}
nav a:hover{border-color:var(--or)}nav a:active{transform:scale(.98)}
nav a:focus-visible{outline:3px solid var(--or);outline-offset:2px}
nav a.main{background:var(--or);border-color:var(--or);color:#fff;font-weight:700;font-size:16px}
nav a span{flex:1}nav a small{font-size:13px;color:var(--muted)}
nav svg{flex:none}
section{padding:34px 20px 0}
h2{margin:0 0 16px;display:flex;align-items:center;gap:10px;font:600 14px Saira,sans-serif;letter-spacing:2.5px;text-transform:uppercase}
h2::before{content:"";width:22px;height:3px;background:var(--or);border-radius:2px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hero{grid-column:span 2;background:#282A2B;color:#F0F0EF;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;font:600 18px Saira,sans-serif}
.chip{background:var(--card);border:1.5px solid #E3E3E0;border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px}
.chip::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--or);transform:rotate(45deg);flex:none}
footer{margin-top:auto;padding:32px 20px 28px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
footer .ic{width:26px;height:auto}
</style>
</head>
